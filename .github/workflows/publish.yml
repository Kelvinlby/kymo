# Publishes the Python SDK (sdk/python, distribution "kymo-logger") to PyPI
# when a tag like v0.1.0 is pushed. Uses PyPI Trusted Publishing (OIDC):
# no API token is stored anywhere.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds and tests only, never publishes

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi

      - name: Test (oldest and newest supported Python)
        run: |
          uv run --python 3.9  --with pytest pytest -q
          uv run --python 3.13 --with pytest pytest -q

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kymo-logger/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
