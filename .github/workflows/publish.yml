# Releases the Python SDK (sdk/python, distribution "kymo-logger").
# Push a tag like v0.1.0 (or create a release with a new tag in the GitHub
# UI, which pushes the tag) and this workflow: tests -> builds -> uploads to
# PyPI -> creates/updates the GitHub Release with the wheel and sdist.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# The tag must point at a commit that contains this file, and must match
# the version in sdk/python/pyproject.toml.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds and tests only, never publishes

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi

      - name: Test (oldest and newest supported Python)
        run: |
          uv run --python 3.9  --with pytest pytest -q
          uv run --python 3.13 --with pytest pytest -q

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kymo-logger/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true # re-running a release job is safe

  # Every published tag also gets a GitHub Release with the built files
  # attached. If you already created the release in the GitHub UI, the
  # files are just added to it.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
