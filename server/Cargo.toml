[package]
name = "kymo-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
dashmap = "6"
flate2 = "1.1.11"
foldhash = "0.2.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
itoa = "1.0.19"
mimalloc = "0.1.52"
parking_lot = "0.13.0"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sonic-rs = "0.5.12"
tar = { version = "0.4", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-full", "fs", "trace", "decompression-full", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
webauthn-rs = "0.6.2"
zstd = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "kymo-server"
path = "src/main.rs"

[[bin]]
name = "kymo-bench"
path = "src/bin/kymo-bench.rs"
