[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kymo-logger"
version = "0.2.3"
description = "Non-blocking Python logging SDK for the Kymo ML experiment tracker"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Kelvin" }]
keywords = ["machine-learning", "experiment-tracking", "logging", "metrics"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Kelvinlby/kymo"
Issues = "https://github.com/Kelvinlby/kymo/issues"
Documentation = "https://github.com/Kelvinlby/kymo/tree/main/sdk/python"

[project.scripts]
kymo = "kymo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kymo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # os.fork() in a multi-threaded process (we test fork safety on purpose)
    "ignore:This process .* is multi-threaded:DeprecationWarning",
]
