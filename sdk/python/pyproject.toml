[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kymo-logger"
version = "0.1.0"
description = "Non-blocking Python logging SDK for the Kymo ML experiment tracker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.scripts]
kymo = "kymo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kymo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # os.fork() in a multi-threaded process (we test fork safety on purpose)
    "ignore:This process .* is multi-threaded:DeprecationWarning",
]
